<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Skyjo Action — Feuille de score</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="css/style.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button { font-family: inherit; }
  input[type=number]::-webkit-inner-spin-button { opacity: 1; }
  .card-btn:active { transform: translateY(1px) scale(0.98); }
  .spin { animation: skyjo-spin 0.8s linear infinite; }
  @keyframes skyjo-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  #app { min-height: 100vh; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
